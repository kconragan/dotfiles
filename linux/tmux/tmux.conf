#------------------------------------------------------------------
# LINUX SPECIFIC SETTINGS (WAYLAND/OMARCHY)
#------------------------------------------------------------------

# Ensure tmux knows to use zsh on Linux
set-option -g default-shell /usr/bin/zsh

# Pass Wayland display to tmux sessions so wl-copy/wl-paste work inside tmux
set -g update-environment "WAYLAND_DISPLAY DISPLAY"

# Wayland clipboard integration (requires wl-clipboard package)
set -s set-clipboard on
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'wl-copy'
